<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <!-- Cordova Content-Security-Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: content:">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#fff">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <title>VStore</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link class="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon.png">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" crossorigin href="./assets/index-CMh6gLwM.css">
</head>
<body>

  <!-- Das Haupt-App-Element für Framework7 -->
  <div id="app">

    <!-- Framework7 Sheet-Modal (Das Banner liegt sicher im #app-Container) -->
    <div class="sheet-modal sheet-modal-bottom cookie-consent-sheet modal-in" style="height: auto;">
      <div class="sheet-modal-inner">
        <div class="page-content">
          <div class="block">
            <p style="margin-top: 0;"><b>Cookie-Einstellungen</b></p>
            <p>Wir nutzen Cookies, um die App-Funktionalität zu gewährleisten.</p>
            <div class="row">
              <button id="reject-cookies" class="col button button-fill button-neutral sheet-close">Nur essenzielle</button>
              <button id="accept-cookies" class="col button button-fill color-green sheet-close">Alle erlauben</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div> <!-- /#app -->
  
  <!-- 1. Zuerst die js-cookie Bibliothek korrekt laden -->
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.8/dist/js.cookie.min.js"></script>

  <!-- 2. Robuster Observer (Wartet, bis F7 das HTML generiert hat) -->
  <script>
    (function() {
      // Funktion, die das Banner steuert, sobald es im DOM existiert
      function initCookieBanner() {
        // Wir suchen das F7 Sheet anhand seiner Klasse
        var banner = document.querySelector('.cookie-consent-sheet');
        var acceptBtn = document.getElementById('accept-cookies');
        var rejectBtn = document.getElementById('reject-cookies');

        if (!banner || !acceptBtn || !rejectBtn) return false;

        if (window.Cookies) {
          var consentStatus = window.Cookies.get('cookie-consent');

          // Wenn bereits ein Cookie da ist, löschen/verstecken wir das Banner sofort
          if (consentStatus) {
            banner.remove();
          } else {
            // Wenn kein Cookie da ist, stellen wir sicher, dass es sichtbar bleibt
            banner.style.setProperty('display', 'block', 'important');
          }

          // Klick-Event: Alle erlauben
          acceptBtn.addEventListener('click', function () {
            window.Cookies.set('cookie-consent', 'all', { expires: 365, secure: true, sameSite: 'strict' });
            banner.remove();
          });

          // Klick-Event: Nur essenzielle
          rejectBtn.addEventListener('click', function () {
            window.Cookies.set('cookie-consent', 'essential', { expires: 365, secure: true, sameSite: 'strict' });
            banner.remove();
          });
        }
        return true;
      }

      // Ein Observer überwacht die Seite und schaut, wann F7 das HTML einfügt
      var observer = new MutationObserver(function(mutations, obs) {
        if (initCookieBanner()) {
          obs.disconnect(); // Stoppen, sobald das Banner erfolgreich eingerichtet wurde
        }
      });

      // Überwachung starten
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
  
  <!-- 3. Framework7 Core Skript laden (Ihre compilierte App-Datei) -->
  <script type="module" crossorigin src="./assets/index-CX6URE9A.js"></script>
  
</body>
</html>
