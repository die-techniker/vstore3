<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <!-- Cordova Content-Security-Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: content:">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#fff">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <title>VStore</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link class="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon.png">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" crossorigin href="./assets/index-CMh6gLwM.css">

  <!-- Kleiner CSS-Style, damit das Banner exakt wie ein Framework7-Sheet aussieht, aber autark bleibt -->
  <style>
    .custom-cookie-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      box-shadow: 0px -2px 10px rgba(0, 0, 0, 0.15);
      z-index: 99999 !important;
      padding: 16px;
      box-sizing: border-box;
      font-family: -apple-system, SF Pro Text, SF UI Text, Helvetica Neue, Helvetica, Arial, sans-serif;
      border-radius: 12px 12px 0 0;
    }
    .custom-cookie-banner p {
      color: #333;
      font-size: 14px;
      margin: 0 0 16px 0;
      line-height: 1.4;
    }
    .custom-cookie-banner .banner-buttons {
      display: flex;
      gap: 10px;
    }
    .custom-cookie-banner button {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .custom-cookie-banner .btn-reject {
      background: #e0e0e0;
      color: #333;
    }
    .custom-cookie-banner .btn-accept {
      background: #4caf50;
      color: #fff;
    }
    /* Schutz vor Überlagerung auf Smartphones mit Home-Bar (iOS) */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .custom-cookie-banner {
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>

  <!-- Das Haupt-App-Element für Framework7 (Bleibt unberührt) -->
  <div id="app"></div>

  <!-- COOKIE BANNER: Liegt AUSSERHALB von #app, damit F7 es nicht automatisch ausblenden kann -->
  <div id="custom-cookie-banner" class="custom-cookie-banner" style="display: none;">
    <p><b>Cookie-Einstellungen</b><br>Wir nutzen Cookies, um die App-Funktionalität zu gewährleisten.</p>
    <div class="banner-buttons">
      <button id="reject-cookies" class="btn-reject">Nur essenzielle</button>
      <button id="accept-cookies" class="btn-accept">Alle erlauben</button>
    </div>
  </div>
  
  <!-- 1. Zuerst die js-cookie Bibliothek korrekt laden -->
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.8/dist/js.cookie.min.js"></script>

  <!-- 2. Unabhängige Steuerung (Wartet, bis das DOM bereit ist) -->
  <script>
    (function() {
      function checkConsent() {
        var banner = document.getElementById('custom-cookie-banner');
        var acceptBtn = document.getElementById('accept-cookies');
        var rejectBtn = document.getElementById('reject-cookies');

        if (!banner || !acceptBtn || !rejectBtn || !window.Cookies) return;

        var consentStatus = window.Cookies.get('cookie-consent');

        // Wenn kein Cookie da ist, Banner DAUERHAFT anzeigen
        if (!consentStatus) {
          banner.style.display = 'block';
        }

        // Klick-Event: Alle erlauben
        acceptBtn.addEventListener('click', function () {
          window.Cookies.set('cookie-consent', 'all', { expires: 365, secure: true, sameSite: 'strict' });
          banner.style.display = 'none';
          console.log('Alle Cookies akzeptiert.');
        });

        // Klick-Event: Nur essenzielle
        rejectBtn.addEventListener('click', function () {
          window.Cookies.set('cookie-consent', 'essential', { expires: 365, secure: true, sameSite: 'strict' });
          banner.style.display = 'none';
          console.log('Nur essenzielle Cookies.');
        });
      }

      // Falls die Seite extrem schnell lädt, nutzen wir einen Observer als Sicherheitsnetz
      var observer = new MutationObserver(function(mutations, obs) {
        if (document.getElementById('custom-cookie-banner')) {
          checkConsent();
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
  
  <!-- 3. Framework7 Core Skript laden (Ihre compilierte App-Datei) -->
  <script type="module" crossorigin src="./assets/index-CX6URE9A.js"></script>
  
</body>
</html>
