<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <!-- Cordova Content-Security-Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: content:">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#fff">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <title>VStore</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link class="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon.png">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" crossorigin href="./assets/index-CMh6gLwM.css">
</head>
<body>

  <!-- Das Haupt-App-Element für Framework7 -->
  <div id="app">

    <!-- COOKIE BANNER: 'modal-in' sorgt dafür, dass das Banner standardmäßig OFFEN startet -->
    <!-- 'display: block' erzwingt die Sichtbarkeit beim ersten Laden -->
    <div id="cookie-banner" class="sheet-modal sheet-modal-bottom cookie-consent-sheet modal-in" style="height: auto; display: none;">
      <div class="sheet-modal-inner">
        <div class="page-content">
          <div class="block">
            <p style="margin-top: 0;"><b>Cookie-Einstellungen</b></p>
            <p>Wir nutzen Cookies, um die App-Funktionalität zu gewährleisten.</p>
            <div class="row">
              <button id="reject-cookies" class="col button button-fill button-neutral sheet-close">Nur essenzielle</button>
              <button id="accept-cookies" class="col button button-fill color-green sheet-close">Alle erlauben</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div> <!-- /#app -->
  
  <!-- 1. Zuerst die js-cookie Bibliothek korrekt laden -->
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.8/dist/js.cookie.min.js"></script>

  <!-- 2. Reine Standard-JavaScript Logik (Läuft unabhängig von Framework7) -->
  <script>
    // Sobald die Seite geladen ist, prüfen wir den Cookie-Status
    window.addEventListener('DOMContentLoaded', function () {
      var banner = document.getElementById('cookie-banner');
      
      if (window.Cookies) {
        var consentStatus = window.Cookies.get('cookie-consent');

        // Wenn noch KEIN Cookie gesetzt wurde, blenden wir das Banner ein
        if (!consentStatus) {
          banner.style.display = 'block';
        }

        // Klick auf "Alle erlauben"
        document.getElementById('accept-cookies').addEventListener('click', function () {
          window.Cookies.set('cookie-consent', 'all', { expires: 365, secure: true, sameSite: 'strict' });
          console.log('Alle Cookies akzeptiert.');
          banner.style.display = 'none'; // Banner ausblenden
        });

        // Klick auf "Nur essenzielle"
        document.getElementById('reject-cookies').addEventListener('click', function () {
          window.Cookies.set('cookie-consent', 'essential', { expires: 365, secure: true, sameSite: 'strict' });
          console.log('Nur essenzielle Cookies.');
          banner.style.display = 'none'; // Banner ausblenden
        });
      }
    });
  </script>
  
  <!-- 3. Framework7 Core Skript laden (Ihre compilierte App-Datei) -->
  <script type="module" crossorigin src="./assets/index-CX6URE9A.js"></script>
  
</body>
</html>
