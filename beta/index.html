<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <!-- Cordova Content-Security-Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: content:">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#fff">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <title>VStore</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link class="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon.png">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" crossorigin href="./assets/index-CMh6gLwM.css">
</head>
<body>

  <!-- Das Haupt-App-Element für Framework7 -->
  <div id="app">

    <!-- Framework7 Sheet-Modal (Das Banner liegt sicher im #app-Container) -->
    <div class="sheet-modal sheet-modal-bottom cookie-consent-sheet" style="height: auto;">
      <div class="sheet-modal-inner">
        <div class="page-content">
          <div class="block">
            <p style="margin-top: 0;"><b>Cookie-Einstellungen</b></p>
            <p>Wir nutzen Cookies, um die App-Funktionalität zu gewährleisten.</p>
            <div class="row">
              <button id="reject-cookies" class="col button button-fill button-neutral sheet-close">Nur essenzielle</button>
              <button id="accept-cookies" class="col button button-fill color-green sheet-close">Alle erlauben</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div> <!-- /#app -->
  
  <!-- 1. Zuerst die js-cookie Bibliothek laden -->
  <script src="https://jsdelivr.net"></script>
  
  <!-- 2. Framework7 Core Skript laden (Ihre bestehende Datei) -->
  <script type="module" crossorigin src="./assets/index-CX6URE9A.js"></script>

  <!-- 3. DIE CONSENT-LOGIK (Wartet, bis die App geladen ist und steuert das Banner) -->
  <script type="module">
    // Wir warten, bis das Fenster komplett geladen ist
    window.addEventListener('load', function() {
      
      // Framework7 Core speichert die App-Instanz meistens global ab.
      // Wir versuchen die Instanz über die typischen F7-Variablen zu greifen:
      var f7App = window.app || window.f7 || (window.Framework7 && window.Framework7.instance);

      if (f7App && window.Cookies) {
        // Status auslesen
        var consentStatus = window.Cookies.get('cookie-consent');

        // Wenn kein Cookie existiert, das Banner öffnen
        if (!consentStatus) {
          f7App.sheet.open('.cookie-consent-sheet', true);
        }

        // Klick-Event: Alle erlauben
        f7App.$('#accept-cookies').on('click', function () {
          window.Cookies.set('cookie-consent', 'all', { expires: 365, secure: true, sameSite: 'strict' });
          console.log('Alle Cookies akzeptiert.');
        });

        // Klick-Event: Nur essenzielle
        f7App.$('#reject-cookies').on('click', function () {
          window.Cookies.set('cookie-consent', 'essential', { expires: 365, secure: true, sameSite: 'strict' });
          console.log('Nur essenzielle Cookies.');
        });
        
      } else {
        // Falls F7 die Instanz nicht global teilt, nutzen wir einen Fallback über das DOM7-Event
        console.log("Suche App-Instanz über DOM...");
        document.addEventListener('app:init', function () {
          // Falls Ihre index-CX6URE9A.js ein Event wirft
        });
      }
    });
  </script>
  
</body>
</html>
